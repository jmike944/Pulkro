# Type check, lint, build and the guard scripts on every push and pull request (docs/CONVENTIONS.md, "Process").
# No secrets: without NEXT_PUBLIC_SUPABASE_* the build is the demo build, which is also what a fork's pull request gets.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # A newer push to the same pull request supersedes the run; pushes to branches each finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Type check, lint, build, guards
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Route types (LayoutProps, PageProps…) are generated by Next: tsc on its own needs them first.
      - run: npx next typegen
      - run: npx tsc --noEmit -p .
      - run: npx eslint .
      - run: npm run build
      - run: node scripts/check-safe-next.mjs
      - run: node scripts/check-permissions.mjs
      - run: npm run check:functions
